<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0a0d'/%3E%3Cpath d='M16 6c3 4 7 5 9 9-3 0-5 1-6 3 2 1 3 3 3 6-3-1-5-3-6-6-1 3-3 5-6 6 0-3 1-5 3-6-1-2-3-3-6-3 2-4 6-5 9-9z' fill='%23c9a04e'/%3E%3C/svg%3E">
<title>Umineko</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="player">
<div id="stage">
  <div id="frame">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="touch" hidden></div>
    <video id="video" playsinline hidden></video>
    <div id="busy" hidden>Loading…</div>
  </div>
  <div id="controls" hidden>
    <button type="button" data-action="menu">Menu</button>
    <button type="button" data-action="log">Log</button>
    <button type="button" data-action="auto">Auto</button>
    <button type="button" data-action="skip">Skip</button>
    <button type="button" data-action="fullscreen">Full</button>
    <button type="button" data-action="turn">Turn</button>
  </div>
</div>
<div id="boot">
  <h1 id="boot-title">Umineko</h1>
  <p id="boot-status">Loading…</p>
  <button type="button" id="start" disabled>Start</button>
  <p id="turn-hint">The picture is turned sideways: turn your phone to read. The Turn button puts it back.</p>
  <pre id="boot-error" hidden></pre>
  <a href="./">All games</a>
</div>
<script src="engine/ponscr.js"></script>
<script src="store.js"></script>
<script src="source.js"></script>
<script src="shell.js"></script>
</body>
</html>
